flarum-gdpr:
  lib:
    data:
      uploads:
        export_description: All files uploaded by the user.
        anonymize_description: Removes the user reference from the uploaded files. The files themselves remain accessible to users that could view them pre-anonymization.
        delete_description: Deletes all files uploaded by the user.

fof-upload:
  admin:
    nav:
      shared-uploads-button: Shared uploads
    shared-uploads:
      description: Upload files that can be used by all users of your forum.
      introduction: |
        Shared uploads are files that can be used by all users of your forum. They are not attached to any post, but can be inserted into posts by using the media manager.

        <strong>Warning:</strong> Shared uploads are not protected by any permissions. Anyone with the URL can view them.
      no-files: No shared files have been uploaded yet.
      refresh-button: Refresh
      title: Shared uploads
      upload-new-button: Upload new file
    pane:
      title: Upload
      description: Set up uploading services and preferences.
    help_texts:
      disable-download-logging: |
        Disable logging every download made by users of your forum. Keeping it enabled allows you to view the number of downloads and other metrics in the nearby future.
      disable-hotlink-protection: |
        Hotlink protection prevents opening downloads from other sites. Current method requires a csrf token and post id.
      download_templates: |
        Download templates are how uploads are shown on your forum, eg like previews, buttons. Currently available:
      mime_types: |
        Decide which files members may upload, where each kind is stored, and how it appears in a post.
      mime_order: |
        Rules are matched from the top down and the first match wins, so put more specific rules above general ones.
      resize: |
        Choose whether you want to resize your images before they get uploaded. You can choose a maximum width and height, in pixels. The resizing process keeps the aspect ratio of the images.
      client_extension: |
        By default Upload will choose a safe file extension based on the MIME type.
        For some file types based around ZIP or binary data this can result in generic extensions being used instead of the expected one.
        Here you can enter a comma-separated list of file extensions that will be kept verbatim.
      thumbnails: |
        Generate a downscaled thumbnail for images at upload time. The thumbnail is shown inline;
        clicking it opens the original full-resolution file in a new tab. Thumbnails significantly
        reduce bandwidth and page weight for forums with many large images.
      thumbnail_quality: |
        Encode quality from 1 to 100, applied to WebP and JPEG thumbnails. Higher values look sharper
        but produce larger files. GIF and PNG thumbnails are lossless and ignore this setting.
        Existing thumbnails keep their current quality until regenerated with the backfill command.
      watermark: |
        Choose whether images will have a watermark added during upload. Watermarks are added to non-gifs based on your preferences below.
      watermark_save_first: Save your changes first. Uploading a watermark reloads the page.
      storage_intro: |
        Services you have configured, or that a file type is using, are shown here. You can set up a service
        before pointing any file type at it, then assign it on the Files tab when you are ready.
      storage_configure_another: |
        Other storage services are installed but not yet set up. Configuring one does not change where files go
        until you assign it to a file type.
      storage_not_installed: "Looking for Amazon S3, Cloudflare R2 or Qiniu? Those need an extra package, see <a>installing storage adapters</a>."
      local_cdn: |
        Optional. If you serve <code>assets/files</code> through a CDN, enter its base URL and uploaded file links will use it.
        Leave blank to serve files directly from your forum.
      s3_provider: |
        Choosing your provider sets the endpoint format, addressing style and ACL support below. Pick "Other S3-compatible"
        if yours is not listed.
      s3_endpoint: |
        The provider's S3 API URL, not your bucket's public URL. Amazon S3 does not need one.
      s3_acl: |
        Applied to each uploaded object. Leave blank for the provider default (usually private).
        Use <code>public-read</code> if files must be readable directly from the bucket.
      s3_acl_unsupported: |
        {provider} does not support ACLs. Control public access in the provider's own dashboard instead.
      s3_path_style: |
        Puts the bucket in the URL path rather than the hostname. Required by MinIO and Cloudflare R2;
        set automatically when you choose a provider.
      custom_s3_url: |
        The public base URL your files are served from, such as a CDN or custom domain in front of the bucket.
        Leave blank to use the provider's default URL. Must include <code>https://</code>.
      s3_instance_profile: |
        Leave both blank to use an IAM role instead. This only works on EC2, ECS or EKS.
      composer_buttons: |
        By default both the media manager button and upload button are visible. You can also choose to display only one button.
    tabs:
